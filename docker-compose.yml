services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  router:
    build: ./router
    volumes:
      - ./router/src:/app/src
    ports:
      - "8788:8788"
    environment:
      REDIS_URL: redis://redis:6379
      CONNECT_RADIUS: "2048"
    depends_on:
      - redis
    command: node --watch src/index.js
  client:
    image: node:24.12.0
    container_name: bobo_rpg_client
    user: node
    working_dir: /app
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      # vite dev proxy(/ai) の転送先。コンテナからはサービス名で解決する
      - AI_SERVER_URL=http://server:8787
      - ROUTER_URL=http://router:8788
    volumes:
      - ./client:/app
    ports:
      - "8010:8010"
    command: sleep infinity

  # AIバックエンド: FastAPI + ローカルLLM(Ollama)
  server:
    build: ./server
    container_name: bobo_rpg_server
    environment:
      # ホスト上で動く Ollama（ytc-llm 等）を参照
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5:7b-instruct
      - DATA_DIR=/app/data
      # Deep Path のパラメータ差分 push 先（router の /push 中継）
      - ROUTER_URL=http://router:8788
    volumes:
      - ./server/data:/app/data
      - ./server/app:/app/app
    ports:
      - "8787:8787"
    # 開発用にホットリロード有効
    command: uvicorn app.main:app --host 0.0.0.0 --port 8787 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
